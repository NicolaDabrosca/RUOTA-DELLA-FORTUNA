<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Ruota della Fortuna</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#243e91,#080c28 65%);color:white;font-family:system-ui,sans-serif;min-height:100vh}header{text-align:center;padding:24px 12px 8px}h1{margin:0;font-size:clamp(30px,6vw,65px);font-style:italic;color:#ffd65a;text-shadow:0 4px #a35317,0 0 25px #ffb52e66;letter-spacing:-2px}small{letter-spacing:3px;color:#b9d4ff}main{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:24px;padding:20px}.stage,.panel{background:#101a42cc;border:1px solid #4962a4;border-radius:22px;padding:20px;box-shadow:0 15px 45px #0005}.stage{text-align:center}.wheel{position:relative;max-width:580px;margin:10px auto}canvas{width:100%;display:block;filter:drop-shadow(0 0 18px #ffbd4650)}.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:38px;height:55px;background:#fff0b0;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 3px #000);z-index:1}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:#29477f;color:white;cursor:pointer;font-weight:800}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(#ffe47a,#ffac29);color:#311b08;font-size:22px;box-shadow:0 5px #a65a16;padding:14px 38px}#result{min-height:64px;margin:20px 0 0;font-size:24px;font-weight:900;color:#ffda64}h2{margin-top:0}label{display:block;font-size:13px;color:#b8c9f4;margin:14px 0 6px}input,textarea{width:100%;background:#080f2a;color:white;border:1px solid #41568b;border-radius:8px;padding:10px}input[type=color]{padding:3px;width:40px;height:40px}input[type=checkbox]{width:auto} .entry{display:grid;grid-template-columns:1fr 42px 38px;gap:6px;align-items:center;margin:7px 0}.entry button{padding:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{font-size:12px;color:#aabbe4}.topbar{display:flex;justify-content:center;gap:8px;margin:12px}#history{font-size:13px;color:#b8c9f4;max-height:100px;overflow:auto}body.show .panel{display:none}body.show main{grid-template-columns:1fr}body.show .stage{max-width:800px;width:100%;margin:auto}@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}.stage,.panel{padding:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;filter:none}.wheel.spinning .pointer{animation:clack .12s infinite alternate;transform-origin:50% 5%}.stage.celebrate{animation:glow 1.1s ease-in-out 3}.stage.lose{animation:shake .45s ease}.result-pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}.wheel.spinning canvas{filter:drop-shadow(0 0 25px #ffd85c99)}@keyframes clack{to{transform:translateX(-50%) rotate(12deg)}}@keyframes glow{50%{box-shadow:0 0 45px #ffcb55aa}}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}@keyframes pop{0%{transform:scale(.65);opacity:.4}100%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.wheel.spinning .pointer,.stage.celebrate,.stage.lose,.result-pop{animation:none}} </style>
<header><small>IL GAME SHOW CHE NON TI ASPETTI</small><h1 id="heading">LA RUOTA DELLA FORTUNA</h1></header><div class="topbar"><button id="toggle">Modalità spettacolo</button><button id="full">Schermo intero</button></div><main><section class="stage"><div class="wheel"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="Ruota dei premi"></canvas></div><button class="primary" id="spin">GIRA LA RUOTA!</button><div id="result" role="status">La fortuna gira… forse.</div><div id="history"></div></section><section class="panel"><h2>⚙ Regia del gioco</h2><label>Titolo del gioco</label><input id="title"><label>Durata del giro (secondi)</label><input id="duration" type="number" min="1" max="20" step="0.5"><label><input type="checkbox" id="sound"> Effetti sonori</label><label>Volume <span id="volumeLabel"></span></label><input id="volume" type="range" min="0" max="100" step="1"><label><input type="checkbox" id="animations"> Animazioni di spettacolo</label><label><input type="checkbox" id="confetti"> Coriandoli e jackpot</label><button id="previewSound" type="button">Prova audio</button><label>Caselle della ruota · <span id="count"></span></label><div id="entries"></div><div class="actions"><button id="add">+ Casella</button><button id="reset">Ripristina</button></div><div class="actions"><button id="export">Esporta JSON</button><button id="import">Importa JSON</button><input type="file" id="file" accept=".json,application/json" hidden style="display:none"></div><p class="muted">Le modifiche si salvano automaticamente in questo browser. Ogni casella ha la stessa probabilità di uscire. I suoni sono sintetizzati, senza audio televisivo originale.</p></section></main>
<canvas id="fx" aria-hidden="true"></canvas><script>
const $=id=>document.getElementById(id),TAU=Math.PI*2;const palette=['#e3314c','#246cce','#f4b632','#159a70','#9b48c5','#ef7831','#0d9fae','#db438e'];const defaults={title:'LA RUOTA DELLA FORTUNA',duration:5,sound:true,volume:65,animations:true,confetti:true,entries:['100 €','RIP 💀','500 €','GIRA ANCORA','ZERO EURO','JACKPOT','CIAO MAMMA','PERDI TUTTO','250 €','BONUS','MALE MALE','1000 €'].map((label,i)=>({label,color:palette[i%palette.length]}))};let config=structuredClone(defaults);function valid(x){return x&&typeof x.title==='string'&&x.title.length<=100&&Number.isFinite(x.duration)&&x.duration>=1&&x.duration<=20&&typeof x.sound==='boolean'&&(x.volume===undefined||(Number.isFinite(x.volume)&&x.volume>=0&&x.volume<=100))&&(x.animations===undefined||typeof x.animations==='boolean')&&(x.confetti===undefined||typeof x.confetti==='boolean')&&Array.isArray(x.entries)&&x.entries.length>=2&&x.entries.length<=48&&x.entries.every(e=>typeof e.label==='string'&&e.label.length<=100&&/^#[0-9a-f]{6}$/i.test(e.color))}try{let x=JSON.parse(localStorage.getItem('fortuna-wheel-v2'));if(valid(x))config={...defaults,...x}}catch{}let angle=0,busy=false,history=[],audio;const c=$('wheel'),ctx=c.getContext('2d');function save(){try{localStorage.setItem('fortuna-wheel-v2',JSON.stringify(config))}catch{} $('heading').textContent=config.title;draw()}
function draw(){const n=config.entries.length,s=TAU/n;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(450,450);ctx.beginPath();ctx.arc(0,0,440,0,TAU);ctx.fillStyle='#e6a52e';ctx.fill();ctx.beginPath();ctx.arc(0,0,425,0,TAU);ctx.fillStyle='#17254e';ctx.fill();for(let i=0;i<72;i++){let a=i*TAU/72;ctx.beginPath();ctx.arc(Math.cos(a)*432,Math.sin(a)*432,4,0,TAU);ctx.fillStyle=i%2?'#fff3bb':'#ffbf44';ctx.fill()}ctx.rotate(angle);config.entries.forEach((e,i)=>{let a=-Math.PI/2-s/2+i*s;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,414,a,a+s);ctx.closePath();ctx.fillStyle=e.color;ctx.fill();ctx.strokeStyle='#ffffff88';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(a+s/2);ctx.translate(385,0);ctx.rotate(Math.PI);ctx.textAlign='left';ctx.textBaseline='middle';ctx.font=`900 ${Math.max(14,Math.min(35,540/n))}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle='#0008';ctx.fillStyle='#fff';let text=e.label||'—';ctx.strokeText(text,0,0,285);ctx.fillText(text,0,0,285);ctx.restore()});ctx.beginPath();ctx.arc(0,0,87,0,TAU);let g=ctx.createRadialGradient(-20,-20,4,0,0,87);g.addColorStop(0,'#fff1aa');g.addColorStop(1,'#b76c12');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff0a0';ctx.lineWidth=6;ctx.stroke();ctx.fillStyle='#42290b';ctx.font='900 29px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GIRA!',0,0);ctx.restore()}
function render(){ $('title').value=config.title;$('duration').value=config.duration;$('sound').checked=config.sound;$('volume').value=config.volume;$('volumeLabel').textContent=config.volume+'%';$('animations').checked=config.animations;$('confetti').checked=config.confetti;$('count').textContent=config.entries.length;$('entries').replaceChildren();config.entries.forEach((e,i)=>{let r=document.createElement('div');r.className='entry';let t=document.createElement('input');t.value=e.label;t.maxLength=100;t.setAttribute('aria-label','Testo casella '+(i+1));t.oninput=()=>{e.label=t.value;save()};let col=document.createElement('input');col.type='color';col.value=e.color;col.setAttribute('aria-label','Colore casella '+(i+1));col.oninput=()=>{e.color=col.value;save()};let b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','Elimina casella '+(i+1));b.disabled=config.entries.length<=2;b.onclick=()=>{config.entries.splice(i,1);render()};r.append(t,col,b);$('entries').append(r)});$('add').disabled=config.entries.length>=48;save()}
function tone(freq=450,len=.035,delay=0,type='triangle',level=.12,end=freq){if(!config.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(end,t+len);g.gain.setValueAtTime(Math.max(.0001,level*config.volume/100),t);g.gain.exponentialRampToValueAtTime(.00001,t+len);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+len)}catch{}}
function beep(freq=450,len=.035){tone(freq,len,0,'triangle',.15,freq*.65)}
function fanfare(kind){if(kind==='lose'){[330,247,165].forEach((f,i)=>tone(f,.28,i*.16,'sawtooth',.08));return}if(kind==='retry'){[392,523,659].forEach((f,i)=>tone(f,.16,i*.12));return}let notes=kind==='jackpot'?[392,523,659,784,1047,784,1047]:[523,659,784,1047];notes.forEach((f,i)=>tone(f,.32,i*.12,'triangle',.16));tone(261.63,.65,notes.length*.12-.1,'sine',.13)}
let fxRun=0;function burst(big){if(!config.animations||!config.confetti||matchMedia('(prefers-reduced-motion: reduce)').matches)return;let cv=$('fx'),g=cv.getContext('2d'),w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;g.scale(d,d);let run=++fxRun,particles=Array.from({length:big?230:100},()=>({x:w/2,y:h*.35,vx:(Math.random()-.5)*19,vy:-Math.random()*13-3,r:Math.random()*6+3,a:Math.random()*6.28,c:palette[Math.floor(Math.random()*palette.length)]})),start=performance.now(),prev=start;function step(now){if(run!==fxRun)return;let dt=Math.min(2,(now-prev)/16.67);prev=now;g.clearRect(0,0,w,h);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.25*dt;p.a+=.12*dt;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);g.restore()}if(now-start<4200)requestAnimationFrame(step);else g.clearRect(0,0,w,h)}requestAnimationFrame(step)}
function outcome(label){let l=label.toUpperCase(),kind=/PERDI|ZERO|RIP|MALE|BANCAROTTA|PERSO/.test(l)?'lose':/ANCORA|RIPROVA/.test(l)?'retry':/JACKPOT/.test(l)?'jackpot':'win';fanfare(kind);$('result').textContent=(kind==='lose'?'💥 ':kind==='retry'?'↻ ':'🎉 ')+label;if(config.animations){let stage=document.querySelector('.stage');stage.classList.remove('celebrate','lose');$('result').classList.remove('result-pop');void stage.offsetWidth;$('result').classList.add('result-pop');stage.classList.add(kind==='lose'?'lose':'celebrate');if(kind==='win'||kind==='jackpot')burst(kind==='jackpot')}}
function lock(v){busy=v;$('spin').disabled=v;document.querySelectorAll('.panel input,.panel button').forEach(e=>e.disabled=v);if(!v)render()}function randomIndex(n){let a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n} $('spin').onclick=()=>{if(busy)return;tone(440,.14);tone(660,.18,.12);lock(true);document.querySelector('.stage').classList.remove('celebrate','lose');$('result').classList.remove('result-pop');if(config.animations)document.querySelector('.wheel').classList.add('spinning');$('result').textContent='ATTENZIONE…';let n=config.entries.length,s=TAU/n,i=randomIndex(n),start=angle,target=(((-i*s+(Math.random()-.5)*s*.75)%TAU)+TAU)%TAU,delta=((target-start)%TAU+TAU)%TAU+TAU*6,t0=performance.now(),ms=config.duration*1000,last=-1;function frame(now){let p=Math.min(1,(now-t0)/ms);angle=start+delta*(1-Math.pow(1-p,4));draw();let tick=Math.floor((angle+s/2)/s);if(tick!==last){beep(420);last=tick}if(p<1)requestAnimationFrame(frame);else{angle%=TAU;let label=config.entries[i].label||'—';document.querySelector('.wheel').classList.remove('spinning');outcome(label);history.unshift(label);$('history').textContent='Ultimi giri: '+history.slice(0,8).join(' · ');lock(false)}}requestAnimationFrame(frame)};
$('title').maxLength=100;$('title').oninput=e=>{config.title=e.target.value;save()};$('duration').onchange=e=>{config.duration=Math.min(20,Math.max(1,Number(e.target.value)||5));e.target.value=config.duration;save()};$('sound').onchange=e=>{config.sound=e.target.checked;save()};$('volume').oninput=e=>{config.volume=Number(e.target.value);$('volumeLabel').textContent=config.volume+'%';save()};$('animations').onchange=e=>{config.animations=e.target.checked;save()};$('confetti').onchange=e=>{config.confetti=e.target.checked;save()};$('previewSound').onclick=()=>fanfare('jackpot');$('add').onclick=()=>{if(config.entries.length<48){config.entries.push({label:'NUOVO PREMIO',color:palette[config.entries.length%palette.length]});render()}};$('reset').onclick=()=>{if(confirm('Ripristinare le impostazioni iniziali?')){config=structuredClone(defaults);angle=0;history=[];$('history').textContent='';$('result').textContent='La fortuna gira… forse.';render()}};$('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='ruota-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!valid(x))throw Error();config={...defaults,...x};angle=0;render()}catch{alert('Configurazione non valida.')}e.target.value=''};$('toggle').onclick=()=>{let show=document.body.classList.toggle('show');$('toggle').textContent=show?'Apri regia':'Modalità spettacolo'};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Schermo intero non disponibile in questo browser.')}};render();</script></html>
